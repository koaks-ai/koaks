name: Verify Node package

on:
  pull_request:
    paths:
      - "core/**"
      - "interop/node/**"
      - "model-provider/**"
      - "koaks-memory/**"
      - "build-logic/**"
      - "settings.gradle.kts"
      - ".github/workflows/verify-node-package.yml"
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify Kotlin bridge and npm package
        run: ./gradlew :interop:node:checkNodePackage
      - name: Run Koaks regressions
        run: ./gradlew :tests:jsNodeTest :tests:jvmTest
