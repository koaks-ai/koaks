name: Publish to Maven Central

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (for example 0.0.1-SNAPSHOT or 0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: maven-central-${{ inputs.version }}
  cancel-in-progress: false

env:
  ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
  ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
  ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
  ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        shell: bash
        run: |
          if [[ -z "${{ inputs.version }}" || "${{ inputs.version }}" =~ [[:space:]] ]]; then
            echo "Version must not be empty or contain whitespace."
            exit 1
          fi

  publish-windows:
    needs: validate-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Upload Windows Kotlin/Native publications
        shell: pwsh
        run: >-
          .\gradlew.bat publishWindowsX64PublicationToMavenCentralRepository
          "-Pversion=${{ inputs.version }}"
          --no-configuration-cache

  publish-apple-jvm-js:
    needs: [validate-version, publish-windows]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Upload Apple, JVM, JS, and multiplatform publications
        run: >-
          ./gradlew publishToMavenCentral
          -Pversion="${{ inputs.version }}"
          --no-configuration-cache

      - name: Publication instructions
        run: |
          {
            echo "## Maven Central"
            if [[ "${{ inputs.version }}" == *-SNAPSHOT ]]; then
              echo "Snapshot ${{ inputs.version }} was uploaded to the Central snapshot repository."
              echo "Snapshot publications do not require deployment approval."
            else
              echo "Two user-managed deployments were uploaded for version ${{ inputs.version }}."
              echo "Open Central Portal, verify both deployments, then publish both."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
